<style>
    :root{
      --bg:#0b1220; --panel:#111a2e; --panel2:#0e1626; --border:#1e2a44;
      --text:#e6ecf7; --muted:#8ea0bf; --faint:#5d6f8f;
      --blue:#4c8dff; --green:#2fbf71; --amber:#e8a13c; --grey:#4a5a78;
      --red:#e05d5d;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;padding:24px 28px 60px}
    h1{font:600 20px Sora,sans-serif;letter-spacing:.2px}
    h2{font:600 13px Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .topbar .meta{color:var(--faint);font-size:12px;margin-top:2px}
    button.refresh{background:var(--blue);border:0;color:#fff;font:600 13px Inter;padding:9px 18px;border-radius:8px;cursor:pointer}
    button.refresh:disabled{opacity:.5;cursor:wait}
    button.refresh:focus-visible{outline:2px solid #fff;outline-offset:2px}
  
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
    .kpi{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--blue);border-radius:10px;padding:14px 16px}
    .kpi .label{color:var(--muted);font-size:12px;font-weight:500}
    .kpi .num{font:700 30px Sora,sans-serif;font-variant-numeric:tabular-nums;margin-top:2px}
    .kpi .sub{color:var(--faint);font-size:12px;margin-top:2px}
    .kpi.c2{border-top-color:#6f7cf0}.kpi.c3{border-top-color:#2fbf71}
    .kpi.c4{border-top-color:#e8a13c}.kpi.c5{border-top-color:#e05d8f}.kpi.c6{border-top-color:#33c2c2}
  
    .grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    @media(max-width:980px){.grid,.grid2{grid-template-columns:1fr}}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;overflow-x:auto}
  
    table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
    th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
    td{padding:8px 10px;border-bottom:1px solid var(--panel2);font-size:13px;white-space:nowrap}
    td.num,th.num{text-align:right}
    tr.total td{font-weight:600;border-top:2px solid var(--border);border-bottom:0}
    tr.unassigned td{color:var(--faint)}
    .mgr{display:block;color:var(--faint);font-size:11px}
  
    .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
    .pill.g{background:rgba(47,191,113,.16);color:var(--green)}
    .pill.a{background:rgba(232,161,60,.16);color:var(--amber)}
    .pill.x{background:rgba(74,90,120,.25);color:var(--muted)}
    .flag{display:block;color:var(--faint);font-size:11px;margin-top:2px}
    .note{color:var(--faint);font-size:12px;margin-top:8px}
  
    .hbar-row{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:8px;margin:5px 0}
    .hbar-label{color:var(--muted);font-size:12px;text-align:right}
    .hbar-track{background:var(--panel2);border-radius:4px;height:16px;overflow:hidden}
    .hbar-fill{background:var(--blue);height:100%;border-radius:4px}
    .hbar-val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
  
    .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-right:12px;margin-bottom:8px}
    .seg button{background:transparent;border:0;color:var(--muted);font:500 12px Inter;padding:6px 12px;cursor:pointer}
    .seg button.on{background:var(--blue);color:#fff}
  
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none}
    .chip.off{opacity:.35}
    .chip .dot{width:9px;height:9px;border-radius:50%}
  
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2740;border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
    #toast.show{opacity:1}
    #toast.err{border-color:var(--red);color:#f2b0b0}
  
    svg text{font-family:Inter,sans-serif}
  </style>
